<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5f6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Clinic Records">
<title>Clinic Patient Records</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
/* Layout: one narrow column like a patient file on a phone; sticky patient banner with medical alerts, tabs below. */
:root{
  --bg:#f3f5f4; --paper:#ffffff; --ink:#18232a; --muted:#5d6b72; --line:#d9e0de;
  --accent:#1f5f6b; --accent-soft:#e1eeef; --alert:#b3261e; --alert-soft:#fbe9e7;
  --warn:#9a6400; --warn-soft:#fdf1d8; --ok:#2e7d4f; --ok-soft:#e3f2e8;
  --f-display:"Fraunces",Georgia,serif; --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  /* tooth status colours */
  --t-caries:#c0392b; --t-fill:#2f6fb5; --t-crown:#b8860b; --t-rct:#7b3fa0; --t-missing:#8a969b; --t-implant:#2e7d4f; --t-ext:#e0662a; --t-frac:#a0522d; --t-bridge:#4a7a8c;
  --t-amal:#55606a; --t-gic:#2a9d8f; --t-cer:#c06c9b; --t-gold:#d9a400; --t-temp:#f2a65a; --t-sec:#7a1f5c;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1517; --paper:#172024; --ink:#e4ecee; --muted:#93a3a9; --line:#2a373c;
  --accent:#6fb8c4; --accent-soft:#1d3338; --alert:#ff8a80; --alert-soft:#3a1d1b;
  --warn:#f0bb5a; --warn-soft:#352a14; --ok:#7fd1a0; --ok-soft:#173023;
  --t-caries:#ff7b6b; --t-fill:#7fb3ee; --t-crown:#e9c46a; --t-rct:#c49ae0; --t-missing:#7d8b90; --t-implant:#7fd1a0; --t-ext:#ff9d66; --t-frac:#d49a76; --t-bridge:#8fc0d0;
  --t-amal:#a9b4bd; --t-gic:#6fd3c4; --t-cer:#f0a3c8; --t-gold:#ffd54f; --t-temp:#ffc489; --t-sec:#e07ab8;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1517; --paper:#172024; --ink:#e4ecee; --muted:#93a3a9; --line:#2a373c;
  --accent:#6fb8c4; --accent-soft:#1d3338; --alert:#ff8a80; --alert-soft:#3a1d1b;
  --warn:#f0bb5a; --warn-soft:#352a14; --ok:#7fd1a0; --ok-soft:#173023;
  --t-caries:#ff7b6b; --t-fill:#7fb3ee; --t-crown:#e9c46a; --t-rct:#c49ae0; --t-missing:#7d8b90; --t-implant:#7fd1a0; --t-ext:#ff9d66; --t-frac:#d49a76; --t-bridge:#8fc0d0;
  --t-amal:#a9b4bd; --t-gic:#6fd3c4; --t-cer:#f0a3c8; --t-gold:#ffd54f; --t-temp:#ffc489; --t-sec:#e07ab8;
  color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:12px 64px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-size:1.45rem;font-weight:600;letter-spacing:-.01em}
h2{font-size:1.05rem;font-weight:600}
h3{font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.top .sub{font-size:.8rem;color:var(--muted)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 14px;font-weight:500;min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn.danger{color:var(--alert);border-color:var(--alert)}
.btn.small{padding:5px 10px;min-height:34px;font-size:.85rem}
.btn:focus-visible,.tooth:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=email],input[type=password],input[type=time],input[type=date],input[type=number],input[type=tel],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:9px 11px;min-height:42px}
textarea{min-height:80px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);min-width:0}
label.f > span{font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* patient list */
.plist{display:flex;flex-direction:column}
.pitem{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.pitem:last-child{border-bottom:0}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;flex:none}
.pitem .nm{font-weight:600}
.pitem .meta{font-size:.8rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.alert{background:var(--alert-soft);color:var(--alert)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.info{background:var(--accent-soft);color:var(--accent)}

/* patient banner */
.banner{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 4px 14px -10px rgba(0,0,0,.35)}
.banner .nm{font-family:var(--f-display);font-size:1.2rem;font-weight:600}
.alerts{display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -2px}
.tab{border:0;background:none;padding:8px 12px;border-radius:9px;font-weight:500;color:var(--muted);white-space:nowrap;min-height:38px}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}

/* medical history */
.mhq{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.mhq .q{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.mhq .q .det{grid-column:1/-1}
.yn{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.yn button{border:0;background:var(--paper);padding:6px 12px;min-height:36px;font-size:.85rem;font-weight:500;color:var(--muted)}
.yn button+button{border-left:1px solid var(--line)}
.yn button.on.y{background:var(--alert-soft);color:var(--alert)}
.yn button.on.n{background:var(--ok-soft);color:var(--ok)}

/* chart */
.tooth{border:1.5px solid transparent;background:none;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 1px;font-family:var(--f-mono);font-size:.74rem;font-weight:600;min-width:0}
.opg{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.opg-in{min-width:600px;display:grid;grid-template-columns:repeat(8,minmax(0,1fr)) 8px repeat(8,minmax(0,1fr));gap:2px;align-items:start}
.opg-in .mid{align-self:stretch;justify-self:center;width:2px;background:var(--ink);opacity:.45}
.opg-in .occ{grid-column:1/-1;height:2px;background:var(--ink);opacity:.45;margin:3px 0}
.opg-in .side{font-size:.7rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;padding:2px 0}
.opg-in .side.r{text-align:right}
.tooth.lo{flex-direction:column-reverse}
.tooth svg{width:100%;max-width:44px;height:auto;display:block}
.tooth .code{font-size:.68rem;line-height:1;min-height:.8em;color:var(--muted)}
.tooth.sel{border-color:var(--accent);background:var(--accent-soft)}
.sedit{display:grid;grid-template-columns:minmax(0,230px) 1fr;gap:16px;align-items:start}
@media(max-width:560px){.sedit{grid-template-columns:1fr}}
.big{width:100%;max-width:230px;margin:0 auto}
.big svg{width:100%;height:auto;display:block;touch-action:manipulation}
.big polygon[data-surf]{cursor:pointer}
.big polygon[data-surf]:focus-visible{outline:none;stroke:var(--accent);stroke-width:3}
.big text{pointer-events:none;font-family:var(--f-mono);font-weight:600;font-size:10px;fill:var(--ink);stroke:var(--paper);stroke-width:3px;paint-order:stroke}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;min-height:38px;font-size:.85rem;display:inline-flex;gap:7px;align-items:center}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip i{width:12px;height:12px;border-radius:3px;flex:none;border:1px solid var(--line)}
.chip small{color:var(--muted);font-size:.72rem;font-weight:400}
.summary{font-size:.88rem;display:flex;flex-direction:column;gap:3px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.summary b{font-family:var(--f-mono)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.statusgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.statusgrid button{border:1.5px solid var(--line);background:var(--paper);border-radius:9px;padding:8px;text-align:left;font-size:.85rem;min-height:42px;display:flex;gap:8px;align-items:center}
.statusgrid button.on{border-color:var(--accent);background:var(--accent-soft)}
.statusgrid b{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);margin-left:auto}
.bpe{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:280px}
.bpe select{text-align:center;font-family:var(--f-mono);font-weight:600}

/* plan */
.phase{display:flex;flex-direction:column;gap:6px}
.phase h3{display:flex;gap:8px;align-items:center}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--paper)}
.item .tn{font-family:var(--f-mono);font-weight:600;background:var(--accent-soft);color:var(--accent);border-radius:7px;padding:3px 7px;font-size:.82rem;min-width:36px;text-align:center}
.item .pr{font-weight:500;min-width:0}
.item .pr small{display:block;color:var(--muted);font-weight:400}
.item .fee{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.item .acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item.done{opacity:.75}
.item.done .pr{text-decoration:line-through;text-decoration-color:var(--muted)}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.totals div{background:var(--bg);border-radius:10px;padding:8px 10px}
.totals b{display:block;font-size:1.05rem;font-variant-numeric:tabular-nums}
.totals span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* notes timeline */
.tl{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px}
.tl .ev{position:relative;padding:0 0 14px 16px}
.tl .ev::before{content:"";position:absolute;left:-7px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--accent)}
.tl .ev .d{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.tl .ev .t{white-space:pre-wrap;overflow-wrap:anywhere}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}
.note-ex{font-size:.75rem;color:var(--warn);background:var(--warn-soft);padding:6px 10px;border-radius:8px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.88rem;z-index:20}
.confirm{border:1px solid var(--alert);background:var(--alert-soft);border-radius:10px;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.88rem}
@media (prefers-reduced-motion:no-preference){.tab,.btn,.tooth{transition:background .15s,border-color .15s}}

/* login, clinic setup and sync */
.auth{max-width:440px;margin:0 auto;padding-top:5vh;display:flex;flex-direction:column;gap:14px;width:100%}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:44px;height:44px;flex:none}
.brand b{display:block;font-family:var(--f-display);font-size:1.35rem;font-weight:600;letter-spacing:-.01em}
.brand span{font-size:.85rem;color:var(--muted)}
.msg{font-size:.9rem;padding:10px 12px;border-radius:10px}
.msg.err{background:var(--alert-soft);color:var(--alert)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
.msg .linkbtn{padding:0;min-height:0;display:inline}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:500;padding:6px 0;min-height:36px;align-self:flex-start}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.8rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.codein{font-family:var(--f-mono);letter-spacing:.12em;text-transform:uppercase}
.invite{font-family:var(--f-mono);font-size:1.45rem;font-weight:600;letter-spacing:.14em;color:var(--accent);background:var(--accent-soft);padding:6px 12px;border-radius:9px;user-select:all;-webkit-user-select:all}
.member{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.member:last-child{border-bottom:0}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted);white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.sync.saving::before{background:var(--warn)}
.sync.error{color:var(--alert)}
.sync.error::before{background:var(--alert)}
.top .sub{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
button:disabled{opacity:.55;cursor:default}
.homenav{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px}
.homenav .tab{flex:1}
.daynav .btn{font-size:1.3rem;min-width:44px}
.appts{display:flex;flex-direction:column;gap:8px}
.appt{display:grid;grid-template-columns:76px 1fr;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.appt .tm{display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.appt .tm b{font-size:.95rem}
.appt .tm span{font-size:.75rem;color:var(--muted)}
.appt .ai{display:flex;flex-direction:column;gap:6px;min-width:0}
.appt .pn{font-size:1rem;font-weight:600;color:var(--ink);padding:0;min-height:0;text-align:left}
.appt.cancelled,.appt.noshow{opacity:.7}
.appt.cancelled .tm b{text-decoration:line-through}
.btn.wa{border-color:var(--ok);color:var(--ok)}
fieldset.ro{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:14px}
fieldset.ro input,fieldset.ro select,fieldset.ro textarea{opacity:1;color:var(--ink);-webkit-text-fill-color:var(--ink)}
.rolesel{width:auto;min-height:34px;padding:4px 8px;font-size:.85rem}
a.btn{text-decoration:none;display:inline-flex;align-items:center;color:inherit}
.filebtn{position:relative;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;align-self:flex-start}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.filebtn.busy{opacity:.7}
.xgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.xcard{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:0;overflow:hidden;text-align:left;min-width:0}
.xthumb{display:block;aspect-ratio:4/3;background:#0b0f10;width:100%;max-width:100%}
.xthumb img{width:100%;height:100%;object-fit:cover;display:block}
.xthumb.pdf{display:grid;place-items:center;color:#e4ecee;font-family:var(--f-mono);font-weight:600;letter-spacing:.1em}
.xmeta{display:flex;flex-direction:column;gap:2px;padding:8px 10px;font-size:.78rem;color:var(--muted)}
.xmeta b{color:var(--ink);font-size:.86rem}
.xview{position:fixed;inset:0;z-index:30;background:#05080a;color:#e4ecee;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(10px + env(safe-area-inset-bottom,0px))}
.xbar{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding-bottom:8px}
.xbar b{display:block}
.xbar .small{color:#93a3a9}
.ximg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto}
.ximg img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in}
.ximg.zoom{display:block}
.ximg.zoom img{max-width:none;max-height:none;cursor:zoom-out}
.xtools{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding-top:10px}
.xtools label{display:flex;flex-direction:column;font-size:.72rem;color:#93a3a9;gap:2px}
.xtools input[type=range]{width:120px}
.xview .btn{background:#172024;border-color:#2a373c;color:#e4ecee}
.xview .btn.danger{color:#ff8a80;border-color:#ff8a80}

/* ===== Desktop redesign: surgery-teal sidebar, calm enamel work area ===== */
:root{--side:#0e3b43;--side-2:#0b2f36;--side-ink:#e7f2f1;--side-mute:#9cc3c0;--side-on:#1d5964;--shadow:0 1px 2px rgba(14,59,67,.06),0 10px 28px -18px rgba(14,59,67,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--side:#0b2227;--side-2:#081a1e;--side-ink:#e4ecee;--side-mute:#8fb3b0;--side-on:#173f46;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -18px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--side:#0b2227;--side-2:#081a1e;--side-ink:#e4ecee;--side-mute:#8fb3b0;--side-on:#173f46;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -18px rgba(0,0,0,.6)}
h3{text-transform:none;letter-spacing:0;font-size:.92rem;color:var(--ink)}
.panel{box-shadow:var(--shadow)}
.btn{transition:background .15s,border-color .15s,transform .08s,box-shadow .15s}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary:hover:not(:disabled){box-shadow:0 6px 16px -8px var(--accent)}
.btn:active:not(:disabled){transform:translateY(1px)}
.avatar{--h:190;background:hsl(var(--h) 55% 92%);color:hsl(var(--h) 55% 26%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .avatar{background:hsl(var(--h) 30% 22%);color:hsl(var(--h) 60% 82%)}}
:root[data-theme="dark"] .avatar{background:hsl(var(--h) 30% 22%);color:hsl(var(--h) 60% 82%)}
.pitem{border-radius:10px;transition:background .15s}
.pitem:hover{background:var(--accent-soft)}
.xnew{display:flex;flex-direction:column;gap:8px}
.xnew-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--ok);background:var(--ok-soft);border-radius:10px}
.clock-mini{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 14px;border-radius:12px;background:linear-gradient(135deg,var(--side),var(--side-2));color:var(--side-ink);font-size:.9rem}
.clock-mini b{font-family:var(--f-display);font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums}
.clock{display:none}
.att-sum{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.att-sum>div{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px}
.att-sum b{display:block;font-size:.9rem}.att-sum small{color:var(--muted);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
table.att{border-collapse:collapse;width:100%;font-size:.86rem}
table.att th,table.att td{text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.att th{font-weight:500;color:var(--muted);font-size:.78rem}
table.att td.num{font-variant-numeric:tabular-nums}
.appts-layout{display:flex;flex-direction:column;gap:14px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-w{font-size:.72rem;color:var(--muted);text-align:center;padding:2px 0}
.cal-d{position:relative;aspect-ratio:1/1;max-width:100%;border:1px solid transparent;background:none;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-variant-numeric:tabular-nums;cursor:pointer;min-width:0}
.cal-d:hover{background:var(--accent-soft)}
.cal-d.has{background:var(--bg)}
.cal-d em{font-style:normal;font-size:.68rem;font-weight:600;color:var(--paper);background:var(--accent);border-radius:999px;padding:0 6px;line-height:1.5}
.cal-d.today{border-color:var(--accent)}
.cal-d.sel{background:var(--accent);color:var(--paper)}
.cal-d.sel em{background:var(--paper);color:var(--accent)}
.chat{gap:10px}
.chat-list{display:flex;flex-direction:column;gap:8px;max-height:58vh;overflow-y:auto;padding:4px 2px}
.chat-day{align-self:center;font-size:.75rem;color:var(--muted);padding:4px 10px;border-radius:999px;background:var(--bg)}
.bubble{max-width:min(520px,88%);padding:9px 12px;border-radius:14px 14px 14px 4px;background:var(--bg);border:1px solid var(--line);align-self:flex-start;display:flex;flex-direction:column;gap:3px}
.bubble.mine{align-self:flex-end;background:var(--accent-soft);border-color:transparent;border-radius:14px 14px 4px 14px}
.bubble.arr{border-color:var(--ok);background:var(--ok-soft)}
.b-head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:.78rem}
.b-head span{color:var(--muted)}
.b-text{white-space:pre-wrap;overflow-wrap:anywhere}
.bubble .linkbtn{padding:0;min-height:0;font-size:.82rem}
.chat-form{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.badge{background:#ff8a65!important;color:#1b1b1b!important;border-radius:999px;padding:0 7px;font-weight:600}
.cam-box{background:#05080a;border-radius:12px;overflow:hidden;transition:opacity .2s}
.cam-box video{display:block;width:100%;max-height:60vh;object-fit:contain}
.cam-box.flash{opacity:.35}
.btn .ic{width:18px;height:18px;vertical-align:-4px}
.credit{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:0;width:100%;max-width:400px;margin:28px auto 4px;padding:18px 20px;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.credit-qr{width:104px;height:104px;padding:7px;background:#fff;border-radius:12px;border:1px solid var(--line);margin-right:22px}
.credit-qr:empty{display:none}
.credit-qr img,.credit-qr canvas{width:88px!important;height:88px!important;display:block}
.credit-txt{display:flex;flex-direction:column;gap:6px;padding-left:22px;border-left:2px solid var(--accent-soft);min-width:0}
.credit-qr:empty+.credit-txt{padding-left:0;border-left:0;align-items:center;text-align:center}
.credit-by{font-size:.74rem;color:var(--muted);letter-spacing:.02em}
.credit-txt b{font-family:var(--f-display);font-size:1.35rem;font-weight:600;color:var(--accent);line-height:1.15}
.credit-role{font-size:.86rem;color:var(--ink);font-weight:500}
.credit-scan{font-size:.72rem;color:var(--muted);margin-top:2px}
.credit-qr:empty~.credit-txt .credit-scan{display:none}
.welcome .credit{margin-top:8px}
@media (max-width:360px){.credit{grid-template-columns:1fr;justify-items:center;text-align:center}.credit-qr{margin:0 0 14px}.credit-txt{padding-left:0;border-left:0;align-items:center}}
.welcome{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding-block:24px}
.welcome-card{width:100%;max-width:520px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:34px 24px;border-radius:20px;background:linear-gradient(160deg,var(--side),var(--side-2));color:var(--side-ink);box-shadow:var(--shadow)}
.welcome-card h1{font-size:clamp(1.6rem,4.5vw,2.3rem);color:var(--side-ink);text-wrap:balance}
.welcome-card .muted{color:var(--side-mute)}
.welcome-hi{margin:0;color:#7fd3cb;font-weight:500}
.welcome-mark svg{width:58px;height:58px;color:#7fd3cb}
.welcome-card .btn.primary{margin-top:10px;background:#7fd3cb;border-color:#7fd3cb;color:#0b2f36;font-weight:600}
@media (prefers-reduced-motion:no-preference){.welcome-card{animation:wIn .5s ease-out both}@keyframes wIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}}
.side-credit{display:none}
.paysum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:620px){.paysum{grid-template-columns:repeat(2,1fr)}}
.paysum>div{background:var(--bg);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.paysum span{font-size:.75rem;color:var(--muted)}
.paysum b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.paysum .due{background:var(--warn-soft)}.paysum .due b{color:var(--warn)}
.discbox{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px dashed var(--line);border-radius:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--paper);padding:7px 14px;min-height:38px;font-weight:500;color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--paper)}
.preview{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.preview b{color:var(--ink)}.preview .due b{color:var(--warn)}.preview .ok b{color:var(--ok)}
.paytable td{vertical-align:top}
.tooth{position:relative}
.xr-dot{position:absolute;top:2px;right:3px;width:8px;height:8px;border-radius:50%;background:#2a9d8f;box-shadow:0 0 0 2px var(--paper)}
.txr{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.txr-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.txr-item{flex:none;width:150px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper);padding:0;text-align:left;cursor:pointer}
.txr-item:hover{border-color:var(--accent)}
.txr-cap{display:flex;flex-direction:column;gap:1px;padding:6px 8px;font-size:.74rem;color:var(--muted)}
.txr-cap b{color:var(--ink);font-size:.8rem}
.oldform{display:flex;flex-direction:column;gap:12px}
.oldrows{display:flex;flex-direction:column;gap:6px}
.oldrow{display:grid;grid-template-columns:150px 80px minmax(0,1fr) 110px;gap:6px}
@media(max-width:620px){.oldrow{grid-template-columns:1fr 1fr}.oldrow select{grid-column:1/-1}}
.imp .seg{align-self:flex-start}
:root{--t-imp:#8e3b5f;--t-pe:#c77d1a;--t-ue:#8a969b;--t-rr:#7a4b2a;--t-ven:#5b8def;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--t-imp:#e08fb4;--t-pe:#f2b45e;--t-ue:#93a3a9;--t-rr:#d1a07a;--t-ven:#9dbcf5;}}
:root[data-theme="dark"]{--t-imp:#e08fb4;--t-pe:#f2b45e;--t-ue:#93a3a9;--t-rr:#d1a07a;--t-ven:#9dbcf5;}
.tooth svg{overflow:visible}
.tooth.prim svg{max-width:34px}
.tooth.prim{font-size:.68rem}
.tooth .code{font-size:.6rem;white-space:normal;text-align:center;line-height:1.15;max-width:100%;overflow-wrap:anywhere}
.opg-in.prim-only{grid-template-columns:repeat(5,minmax(0,1fr)) 8px repeat(5,minmax(0,1fr));min-width:380px;max-width:640px;margin:0 auto}
.opg-in .rowlab{grid-column:1/-1;font-size:.68rem;color:var(--muted);text-align:center;letter-spacing:.04em;margin:2px 0 -2px}
.impbox{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:620px){.grid3{grid-template-columns:1fr}}
:root{--bone:#ecdcc0;--gum:#f0a1a6;--enamel:#fffaf0;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bone:#5b4a35;--gum:#b65f6c;--enamel:#efe6d2;}}
:root[data-theme="dark"]{--bone:#5b4a35;--gum:#b65f6c;--enamel:#efe6d2;}
.sidebig{max-width:240px;margin:0 auto}
.sidebig svg{width:100%;height:auto;display:block}
.toast.success{background:var(--ok);color:var(--paper)}
.toast.error{background:var(--alert);color:var(--paper)}
.shell{display:block}
.sidebar{display:none}
.ic{width:20px;height:20px;flex:none}
@media (min-width:960px){
  body{font-size:15.5px}
  .shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
  .sidebar{display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;padding:24px 16px;background:linear-gradient(180deg,var(--side),var(--side-2));color:var(--side-ink)}
  .side-brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:1.05rem;font-weight:600;color:var(--side-ink)}
  .side-brand svg{width:30px;height:30px;color:#7fd3cb}
  .clock{display:flex;flex-direction:column;gap:2px;padding:4px 2px 2px}
  .clock-time{display:flex;align-items:baseline;gap:6px}
  .clock-time b{font-family:var(--f-display);font-size:2.6rem;font-weight:600;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .clock-time span{font-size:.85rem;color:var(--side-mute);font-weight:600}
  .clock-date{font-size:.86rem;color:var(--side-mute)}
  .side-clinic{display:flex;flex-direction:column;gap:3px;padding:12px;border-radius:12px;background:rgba(255,255,255,.06)}
  .side-clinic b{font-size:1.02rem;line-height:1.3}
  .side-clinic span{font-size:.8rem;color:var(--side-mute)}
  .side-clinic .bad{color:#ffb4ab}
  .side-nav{display:flex;flex-direction:column;gap:4px}
  .side-nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--side-ink);padding:11px 12px;border-radius:10px;font-weight:500;text-align:left;cursor:pointer;transition:background .15s}
  .side-nav button:hover{background:rgba(255,255,255,.07)}
  .side-nav button.on{background:var(--side-on);box-shadow:inset 3px 0 0 #7fd3cb}
  .side-nav em{margin-left:auto;font-style:normal;font-size:.78rem;color:var(--side-mute);font-variant-numeric:tabular-nums}
  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
  .side-user{display:flex;align-items:center;gap:10px}
  .side-user b{display:block;font-size:.92rem}
  .side-user small{color:var(--side-mute)}
  .sidebar .sync{color:var(--side-mute)}
  .side-credit{display:block;font-size:.72rem;color:var(--side-mute);margin:0;line-height:1.35}
  .side-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.16);background:none;color:var(--side-ink);border-radius:9px;padding:7px 10px;font-size:.82rem;cursor:pointer}
  .side-btn:hover{background:rgba(255,255,255,.08)}
  .side-btn .ic{width:16px;height:16px}
  .sidebar :focus-visible{outline:2px solid #7fd3cb;outline-offset:2px}
  .desk-hide{display:none!important}
  .main{min-width:0}
  .main .wrap{max-width:1120px;padding-inline:36px;padding-block:30px 72px;gap:18px}
  h1{font-size:1.9rem}
  .top .sub{font-size:.85rem}
  .plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
  .pitem{border:1px solid var(--line);padding:14px;background:var(--paper)}
  .pitem:last-child{border-bottom:1px solid var(--line)}
  .pitem:hover{border-color:var(--accent)}
  .settings-col{max-width:780px}
  .banner{top:12px}
  .opg-in{min-width:0}
  .appt{grid-template-columns:96px 1fr}
  .appts-layout{display:grid;grid-template-columns:340px minmax(0,1fr);align-items:start;gap:18px}
  .cal{position:sticky;top:20px}
}
